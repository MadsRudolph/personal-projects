name = "component-scanner-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets are set with `wrangler secret put <NAME>`, never committed:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put NEXAR_CLIENT_ID
#   wrangler secret put NEXAR_CLIENT_SECRET
# Non-secret vars:
[vars]
CLAUDE_MODEL = "claude-sonnet-4-6"
RATE_LIMIT = "60"
# Cache resolved datasheets for 30 days so each unique part is paid for once.
DATASHEET_CACHE_TTL = "2592000"
IDENTIFY_CACHE_TTL = "604800"

# Persistent cache (shared across all requests/users) — each unique datasheet
# lookup hits the paid API only once, then serves from KV.
[[kv_namespaces]]
binding = "CACHE"
id = "7169ecf896534e42b659e97516b89554"

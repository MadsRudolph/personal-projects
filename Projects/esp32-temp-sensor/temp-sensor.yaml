esphome:
  name: temp-sensor
  friendly_name: Temp Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Temp-Sensor Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

one_wire:
  - platform: gpio
    pin: GPIO19

sensor:
  - platform: dallas_temp
    index: 0
    name: "Temperature"
    update_interval: 30s
    on_value:
      then:
        - logger.log: "Got temperature reading"

status_led:
  pin: GPIO2

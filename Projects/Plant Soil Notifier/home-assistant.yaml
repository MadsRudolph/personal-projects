# Optional Home Assistant snippets for the Plant Soil Notifier.
#
# Entity IDs assume HA prefixed entities with the friendly_name "plant_soil_notifier_".
# If yours differ, use the dashboard/automation entity picker's autocomplete to correct them.

# --------------------------------------------------------------------------------------
# Lovelace dashboard card (Dashboard -> Edit -> Raw configuration editor, paste into a view)
# --------------------------------------------------------------------------------------
# type: entities
# title: Plant Soil Notifier
# entities:
#   - entity: sensor.plant_soil_notifier_soil_moisture
#     name: Soil moisture
#   - entity: binary_sensor.plant_soil_notifier_needs_water
#     name: Needs water

# --------------------------------------------------------------------------------------
# Dry-soil notification (paste into automations.yaml)
# Fires once when the soil first reads dry for 5 min straight. `mode: single` + the
# state trigger mean it won't re-notify until the soil recovers and goes dry again.
# --------------------------------------------------------------------------------------
- id: plant_soil_dry_alert
  alias: "Plant soil — dry alert"
  trigger:
    - platform: state
      entity_id: binary_sensor.plant_soil_notifier_needs_water
      to: "on"
      for: "00:05:00"
  action:
    # Deployed target on this HAOS is the Galaxy: notify.mobile_app_sm_s928b.
    # Use notify.notify here if you copy this to a different setup.
    - service: notify.mobile_app_sm_s928b
      data:
        title: "Plant needs water"
        message: >-
          Soil moisture dropped to
          {{ states('sensor.plant_soil_notifier_soil_moisture') }}% — time to water.
  mode: single


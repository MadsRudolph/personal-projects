[env:mega2560]
platform = atmelavr
board = megaatmega2560

; Bare-metal AVR C — no Arduino framework
; framework is intentionally omitted

build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -funsigned-char
    -funsigned-bitfields
    -fpack-struct
    -fshort-enums

build_src_filter = +<*> -<.git/> -<.svn/> -<test_*.c>

upload_protocol = wiring
upload_port = COM7
upload_speed = 115200

monitor_port = COM7
monitor_speed = 115200

; ══════════════════════════════════════════════════════════════════════
;  Breadboard Test Environments
; ══════════════════════════════════════════════════════════════════════

; ── Test 1: OLED + MCP3208 ADC only ─────────────────────────────────
[env:test_basic]
platform = atmelavr
board = megaatmega2560

build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -funsigned-char
    -funsigned-bitfields
    -fpack-struct
    -fshort-enums

build_src_filter =
    +<test_basic.c>
    +<spi.c>
    +<i2c.c>
    +<uart.c>
    +<timer.c>
    +<adc_mcp3208.c>
    +<display.c>
    +<font5x7.c>

upload_protocol = wiring
upload_port = COM7
upload_speed = 115200

monitor_port = COM7
monitor_speed = 115200


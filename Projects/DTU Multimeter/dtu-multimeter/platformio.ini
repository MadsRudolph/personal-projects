[env:mega2560]
platform = atmelavr
board = megaatmega2560

; Bare-metal AVR C — no Arduino framework
; framework is intentionally omitted

build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -funsigned-char
    -funsigned-bitfields
    -fpack-struct
    -fshort-enums

build_src_filter = +<*> -<.git/> -<.svn/>

upload_protocol = wiring
upload_port = COM7
upload_speed = 115200

monitor_port = COM7
monitor_speed = 115200

; BLE Digital Caliper
;
; Two targets on purpose: the protoboard prototype is a classic ESP32 DevKit,
; the eventual PCB is an ESP32-C3 SuperMini. Keeping both means the prototype
; does not fork the code.
;
; The BleKeyboard library is not compatible with arduino-esp32 3.x, so the
; platform is pinned to a 6.x release that still ships the 2.0.x core. Verify
; before bumping.

[platformio]
; The protoboard is what is on the bench. Switch to esp32-c3-supermini for the
; PCB, or pick either with:  pio run -e <name>
default_envs = esp32dev-protoboard

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2

; Classic ESP32 DevKit (WROOM-32), on protoboard. Note that GPIO1 and GPIO3 are
; UART0 -- the USB serial bridge -- so this board cannot use the C3 pin map.
[env:esp32dev-protoboard]
board = esp32dev

; ESP32-C3 SuperMini, the PCB target. Native USB, hence the CDC flags.
[env:esp32-c3-supermini]
board = lolin_c3_mini
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; BLE Digital Caliper -- ESP32-C3 SuperMini
;
; The BleKeyboard library is not compatible with arduino-esp32 3.x, so the
; platform is pinned to a 6.x release that still ships the 2.0.x core. Verify
; before bumping.

[env:esp32-c3-supermini]
platform = espressif32@^6.5.0
board = lolin_c3_mini
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2

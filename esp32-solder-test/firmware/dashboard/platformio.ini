; WiFi dashboard for the ESP32 solder test board: set the green LED's
; blink frequency from a browser. Needs src/secrets.h (copy
; secrets.h.example). Flash like the blink test: hold BOOT, tap RESET,
; release BOOT, `pio run -t upload`, then tap RESET.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Blink test for the ESP32 solder test board (bring-up step 6).
; No auto-reset circuit on the board: enter download mode by hand
; (hold BOOT, tap RESET, release BOOT) before `pio run -t upload`,
; then tap RESET to run.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
